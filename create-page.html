<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Organization Page | Redmont Archives</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header>

    <div class="container nav">

        <a class="brand" href="/">
            <span class="mark">RA</span>
            <span>Redmont Archives</span>
        </a>

        <nav>
            <a href="/">Archive</a>
            <a href="/#categories">Categories</a>
            <a href="/#about">About</a>
        </nav>

    </div>

</header>

<main>

    <section class="hero">

        <div class="container hero-inner">

            <div class="eyebrow">
                ORGANIZATION ARCHIVE
            </div>

            <h1>
                Create a Page
            </h1>

            <p>
                Publish or save information as part of an organization's archive.
            </p>

        </div>

    </section>

    <section class="section">

        <div class="container">

            <div class="card">

                <div class="eyebrow">
                    PAGE INFORMATION
                </div>

                <h2>
                    New Organization Page
                </h2>

                <form id="page-form">

                    <label for="organization-id">
                        Organization
                    </label>

                    <select
                        id="organization-id"
                        name="organization-id"
                        required
                    >
                        <option value="">
                            Loading organizations...
                        </option>
                    </select>

                    <br><br>

                    <label for="title">
                        Page Title
                    </label>

                    <input
                        id="title"
                        name="title"
                        type="text"
                        placeholder="About the Organization"
                        required
                    >

                    <br><br>

                    <label for="slug">
                        Page Slug
                    </label>

                    <input
                        id="slug"
                        name="slug"
                        type="text"
                        placeholder="about"
                        required
                    >

                    <br><br>

                    <label for="content">
                        Page Content
                    </label>

                    <textarea
                        id="content"
                        name="content"
                        rows="10"
                        placeholder="Enter the information you want to publish..."
                        required
                    ></textarea>

                    <br><br>

                    <label for="status">
                        Page Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        required
                    >
                        <option value="draft">
                            Draft
                        </option>

                        <option value="published">
                            Published
                        </option>

                    </select>

                    <br><br>

                    <button type="submit" id="create-button">
                        Create Page
                    </button>

                </form>

                <div id="result" hidden></div>

            </div>

        </div>

    </section>

</main>

<footer>

    <div class="container foot">

        <span>
            © 2026 Redmont Archives
        </span>

        <span>
            Organization Archive
        </span>

    </div>

</footer>

<script>

const form = document.getElementById("page-form");
const result = document.getElementById("result");
const button = document.getElementById("create-button");
const organizationSelect = document.getElementById("organization-id");

async function loadOrganizations() {

    try {

        const response = await fetch("/api/organizations");

        if (!response.ok) {
            throw new Error("Unable to load organizations.");
        }

        const data = await response.json();

        organizationSelect.innerHTML = "";

        if (!data.organizations || data.organizations.length === 0) {

            organizationSelect.innerHTML = `
                <option value="">
                    No organizations available
                </option>
            `;

            return;
        }

        const placeholder = document.createElement("option");

        placeholder.value = "";
        placeholder.textContent = "Select an organization...";
        placeholder.disabled = true;
        placeholder.selected = true;

        organizationSelect.appendChild(placeholder);

        data.organizations.forEach(organization => {

            const option = document.createElement("option");

            option.value = organization.id;
            option.textContent = organization.name;

            organizationSelect.appendChild(option);

        });

        const params = new URLSearchParams(window.location.search);
        const requestedSlug = params.get("organization");

        if (requestedSlug) {

            const matchingOrganization =
                data.organizations.find(
                    organization =>
                        organization.slug === requestedSlug
                );

            if (matchingOrganization) {
                organizationSelect.value = matchingOrganization.id;
            }

        }

    } catch (error) {

        console.error(error);

        organizationSelect.innerHTML = `
            <option value="">
                Unable to load organizations
            </option>
        `;

    }

}

form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const organizationId = organizationSelect.value;

    const title =
        document.getElementById("title").value.trim();

    const slug =
        document.getElementById("slug").value.trim();

    const content =
        document.getElementById("content").value.trim();

    const status =
        document.getElementById("status").value;

    button.disabled = true;
    button.textContent = "Creating...";

    result.hidden = true;
    result.innerHTML = "";

    try {

        const response = await fetch("/api/create-page", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                organization_id: organizationId,
                title,
                slug,
                content,
                status
            })

        });

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Unable to create page."
            );

        }

        const statusText =
            data.page.status === "published"
                ? "published to"
                : "saved as a draft in";

        result.innerHTML = `
            <br>

            <div class="eyebrow">
                PAGE CREATED
            </div>

            <h3>
                ${escapeHTML(data.page.title)}
            </h3>

            <p>
                Your page has been ${statusText}
                the organization archive.
            </p>
        `;

        result.hidden = false;

        form.reset();

        await loadOrganizations();

    } catch (error) {

        console.error(error);

        result.innerHTML = `
            <br>

            <div class="eyebrow">
                ERROR
            </div>

            <p>
                ${escapeHTML(error.message)}
            </p>
        `;

        result.hidden = false;

    } finally {

        button.disabled = false;
        button.textContent = "Create Page";

    }

});

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

loadOrganizations();

</script>

</body>
</html>
