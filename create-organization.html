<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Organization | Redmont Archives</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header>
    <div class="container nav">

        <a class="brand" href="/">
            <span class="mark">RA</span>
            <span>Redmont Archives</span>
        </a>

        <nav>
            <a href="/">Archive</a>
            <a href="/#categories">Categories</a>
            <a href="/#about">About</a>
        </nav>

    </div>
</header>

<main>

    <section class="hero">
        <div class="container hero-inner">

            <div class="eyebrow">
                ORGANIZATION DIRECTORY
            </div>

            <h1>
                Create an Organization
            </h1>

            <p>
                Create a public organization archive on Redmont Archives.
            </p>

        </div>
    </section>

    <section class="section">

        <div class="container">

            <div class="card">

                <div class="eyebrow">
                    ORGANIZATION INFORMATION
                </div>

                <h2>
                    New Organization
                </h2>

                <form id="organization-form">

                    <label for="name">
                        Organization Name
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Example Organization"
                        required
                    >

                    <br><br>

                    <label for="slug">
                        Organization Slug
                    </label>

                    <input
                        id="slug"
                        name="slug"
                        type="text"
                        placeholder="example-organization"
                        required
                    >

                    <br><br>

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe this organization..."
                        rows="6"
                    ></textarea>

                    <br><br>

                    <button type="submit" id="create-button">
                        Create Organization
                    </button>

                </form>

                <div id="result" hidden></div>

            </div>

        </div>

    </section>

</main>

<footer>

    <div class="container foot">

        <span>
            © 2026 Redmont Archives
        </span>

        <span>
            Organization Directory
        </span>

    </div>

</footer>

<script>
const form = document.getElementById("organization-form");
const result = document.getElementById("result");
const button = document.getElementById("create-button");

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const slug = document.getElementById("slug").value.trim();
    const description = document.getElementById("description").value.trim();

    button.disabled = true;
    button.textContent = "Creating...";

    result.hidden = true;
    result.innerHTML = "";

    try {
        const response = await fetch("/api/create-organization", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                slug,
                description
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Unable to create organization."
            );
        }

        result.innerHTML = `
            <br>
            <div class="eyebrow">ORGANIZATION CREATED</div>

            <h3>${escapeHTML(data.organization.name)}</h3>

            <p>
                Your organization has been added to the Redmont Archives.
            </p>

            <p>
                <a href="/organizations/${encodeURIComponent(data.organization.slug)}">
                    View organization archive →
                </a>
            </p>
        `;

        result.hidden = false;
        form.reset();

    } catch (error) {

        console.error(error);

        result.innerHTML = `
            <br>
            <div class="eyebrow">ERROR</div>

            <p>
                ${escapeHTML(error.message)}
            </p>
        `;

        result.hidden = false;

    } finally {
        button.disabled = false;
        button.textContent = "Create Organization";
    }
});

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
