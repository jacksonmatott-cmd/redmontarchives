<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Organization | Redmont Archives
    </title>

    <meta
        name="description"
        content="Create an organization on Redmont Archives."
    >

    <link
        rel="stylesheet"
        href="/styles.css"
    >

</head>

<body>

<header>

    <div class="container nav">

        <a class="brand" href="/">
            <span class="mark">RA</span>
            <span>Redmont Archives</span>
        </a>

        <nav>

            <a href="/">
                Archive
            </a>

            <a href="/organizations.html">
                Organizations
            </a>

            <a href="/login.html">
                Log In
            </a>

        </nav>

    </div>

</header>

<main>

    <section class="hero">

        <div class="container hero-inner">

            <div class="eyebrow">
                ORGANIZATION DIRECTORY
            </div>

            <h1>
                Create an Organization
            </h1>

            <p>
                You must be logged in to create and manage an organization.
            </p>

        </div>

    </section>

    <section class="section">

        <div class="container">

            <div class="card">

                <div class="eyebrow">
                    NEW ORGANIZATION
                </div>

                <h2>
                    Organization Information
                </h2>

                <form id="organization-form">

                    <label for="name">
                        Organization Name
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        maxlength="100"
                        placeholder="Organization name"
                        required
                    >

                    <br>
                    <br>

                    <label for="slug">
                        URL Slug
                    </label>

                    <input
                        id="slug"
                        name="slug"
                        type="text"
                        maxlength="100"
                        placeholder="organization-name"
                    >

                    <br>
                    <br>

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        maxlength="1000"
                        rows="6"
                        placeholder="Describe this organization..."
                    ></textarea>

                    <br>
                    <br>

                    <button
                        id="create-button"
                        type="submit"
                    >
                        Create Organization
                    </button>

                </form>

                <div
                    id="result"
                    hidden
                ></div>

            </div>

        </div>

    </section>

</main>

<footer>

    <div class="container foot">

        <span>
            © 2026 Redmont Archives
        </span>

        <span>
            Organization Creation
        </span>

    </div>

</footer>

<script>

const form =
    document.getElementById("organization-form");

const button =
    document.getElementById("create-button");

const result =
    document.getElementById("result");

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name")
                .value
                .trim();

        const slug =
            document.getElementById("slug")
                .value
                .trim();

        const description =
            document.getElementById("description")
                .value
                .trim();

        button.disabled = true;
        button.textContent = "Creating...";

        result.hidden = true;
        result.textContent = "";

        try {

            const response =
                await fetch(
                    "/api/create-organization",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            slug,
                            description
                        })
                    }
                );

            const data =
                await response.json();

            if (
                response.status === 401 &&
                data.redirect
            ) {

                const returnTo =
                    window.location.pathname +
                    window.location.search;

                window.location.href =
                    data.redirect +
                    "?returnTo=" +
                    encodeURIComponent(
                        returnTo
                    );

                return;
            }

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Unable to create organization."
                );

            }

            result.innerHTML =
                "<div class=\"eyebrow\">" +
                "ORGANIZATION CREATED" +
                "</div>" +
                "<h3>" +
                escapeHTML(
                    data.organization.name
                ) +
                "</h3>" +
                "<p>" +
                "Your organization has been created." +
                "</p>" +
                "<p>" +
                "<a href=\"/organizations/" +
                encodeURIComponent(
                    data.organization.slug
                ) +
                "\">" +
                "View organization →" +
                "</a>" +
                "</p>";

            result.hidden = false;

            form.reset();

        } catch (error) {

            console.error(error);

            result.innerHTML =
                "<div class=\"eyebrow\">" +
                "ERROR" +
                "</div>" +
                "<p>" +
                escapeHTML(
                    error.message
                ) +
                "</p>";

            result.hidden = false;

        } finally {

            button.disabled = false;
            button.textContent =
                "Create Organization";

        }

    }
);

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
